<!DOCTYPE html>
<html>

<head>
    <title>Capybara Clicker</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body id="body" class="normal">
    <div id="big-container">
        <div style="flex-direction: column; display: flex;">
            <p id="cps-indicator">0 cps</p>
            <button type="button" class="debug" id="factory-reset">reset everything (debug)</button>
            <button type="button" class="debug" id="1000clicks">+1000 clicks (debug)</button>
            <button type="button" class="debug" id="20000clicks">+20000 clicks (debug)</button>
        </div>
        <div id="capy-column">
            <p id="capy-clicks-indicator">0</p>
            <p id="click-power-indicator"></p>
            <p id="autoclick-indicator"></p>
            <img id="capybara" src="images/capybara.png">
        </div>
        <div id="shop-container">
            <p id="shop-title">Shop</p>
            <div class="shop-item">
                <img src="images/hand.png">
                <p class="shop-desc">+1 Units per click</p>
                <p class="shop-price">10</p>
            </div>
            <div class="shop-item">
                <img src="images/hand.png">
                <p class="shop-desc">Autoclicker +1/s</p>
                <p class="shop-price">50</p>
            </div>
            <div class="shop-item locked" id="shop-item-mrclicker">
                <div class="shop-cover-container">
                    <p class="shop-cover">????</p>
                    <p class="shop-cover-desc">Unlocks at 2000 clicks</p>
                    <p class="shop-desc">+50 Units per click</p>
                    <p class="shop-price">2000</p>
                </div>
            </div>
            <div class="shop-item locked" id="shop-item-capycap">
                <div class="shop-cover-container">
                    <p class="shop-cover">????</p>
                    <p class="shop-cover-desc">Unlocks at 50000 clicks</p>
                    <p class="shop-desc">(2x everything)</p>
                    <p class="shop-price">50000</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
